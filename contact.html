<!DOCTYPE HTML>
<html>
<head>
    <title>Contact | Paradigm Shift</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
        /* Specific contact styles to match the reference */
        .form-wrapper { padding: 2rem 0; }
        .field { margin: 0 0 1.5rem 0; }
        label { display: block; font-weight: 600; margin: 0 0 0.5rem 0; text-transform: uppercase; font-size: 0.8rem; color: #1b1b1b; }
        input[type="text"], input[type="email"], textarea {
            width: 100%; border: solid 2px #eeeeee; background: #fafafa;
            padding: 0.75rem; font-family: inherit; transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #00d4ff; outline: 0; }
        button {
            background: #1b1b1b; color: #fff; border: 0; padding: 1rem 2rem;
            font-weight: 600; text-transform: uppercase; letter-spacing: 0.1rem;
            cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #00d4ff; }
        .contact-info { margin-bottom: 3rem; border-bottom: solid 2px #eeeeee; padding-bottom: 2rem; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div id="wrapper">
        <section>
            <header>
                <h2>Get in touch</h2>
                <p>Quisque sed tellus tristique, cursus urna et, hendrerit erat. Lorem ipsum dolor sit amet.</p>
            </header>
            <div class="content">
                <span class="image main"><img src="images/09.jpg" alt="Office space"></span>
                
                <div class="contact-info">
                    <h3>Contact Information</h3>
                    <p>Feel free to reach out via the form below or through our direct channels.</p>
                    <p><strong>Email:</strong> info@paradigm.tld<br>
                    <strong>Phone:</strong> (000) 000-0000</p>
                </div>

                <div class="form-wrapper">
                    <form method="post" action="#">
                        <div class="field">
                            <label for="name">Name</label>
                            <input type="text" name="name" id="name" />
                        </div>
                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" name="email" id="email" />
                        </div>
                        <div class="field">
                            <label for="message">Message</label>
                            <textarea name="message" id="message" rows="6"></textarea>
                        </div>
                        <button type="submit">Send Message</button>
                    </form>
                </div>

                <span class="image main" style="margin-top: 3rem;"><img src="images/10.jpg" alt="Map view"></span>
            </div>
        </section>
    </div>
</body>
</html>
